# NordicCart synthetic data generator settings.
# No credentials here: database settings come from config/.env (see config/.env.example)
# or from the standard PostgreSQL environment variables.
#
# Changing seed or any value below changes the generated data. Reruns with the same
# settings produce the same rows, so the seeder inserts nothing new on a rerun.

[generator]
seed = 20261117
default_profile = "pilot"

# Dataset sizes. Countries (4), currencies (4), product categories (10), stores (12)
# and warehouses (4) are fixed by python/nordiccart/reference_data and are the same
# in every profile. Customers and products are generated in a fixed order, so the
# pilot rows are exactly the first rows of the full dataset: scaling up only adds rows.
[profiles.pilot]
products = 20
customers = 100

[profiles.full]
products = 500
customers = 20000

[calendar]
# 24 months of simulated activity (used by later steps), fully in the past.
# Starts after Finland's VAT change to 25.5% on 2024-09-01, so one VAT rate per country holds.
simulation_start = 2024-11-01
simulation_end = 2026-10-31          # last simulated day, inclusive
catalogue_start = 2022-01-01         # earliest product launch date

[customers]
# Share of customers per market. Registration dates fall between the market launch
# (reference_data/markets.json) and simulation_end, weighted towards recent years.
country_weights = { SE = 0.40, NO = 0.20, DK = 0.22, FI = 0.18 }
growth_exponent = 1.6                # 1 = even over time; higher = more recent sign-ups
in_store_signup_share = 0.30         # only where a store in the market was already open
in_store_home_city_share = 0.75      # in-store sign-ups living in the store's city
phone_share = 0.90
birth_date_share = 0.92
address_share = 0.97
email_domains = ["example.com", "example.net", "example.org"]

[products]
launched_before_simulation_share = 0.75   # the rest launch during the simulation window

[pricing]
# EUR to local currency rates used to set list prices (ECB annual averages 2025).
# Only for price setting: the daily exchange_rates table is generated with the
# business activity simulation, not in this step.
reference_rates = { EUR = 1.0, SEK = 11.0671, NOK = 11.7182, DKK = 7.4634 }
market_price_factor = { SE = 1.00, NO = 1.04, DK = 1.00, FI = 1.00 }
margin_jitter = 0.02                 # per-market variation of the product margin

[output]
csv_dir = "output/master_data"       # dry-run CSV preview, one folder per profile
log_dir = "logs"

[inventory]
# Opening stock (Phase 3, step 2): python/run_opening_inventory.py
# Every product is listed at every store and warehouse (one inventory_balances row each).
# Products launched on or before opening_date get one opening_balance movement per
# location, dated 00:00 local time on opening_date. Products launched later start at 0;
# their first stock arrives as a purchase_receipt in the activity simulation.
opening_date = 2024-11-01                 # first simulated day (calendar.simulation_start)
external_reference = "OB-20241101"        # stock count document on every opening movement
online_share = 0.55                       # share of a market's demand served by its warehouse
store_format_weight = { flagship = 2.0, standard = 1.0 }
weeks_of_cover = { store = 6, warehouse = 10 }
lead_time_weeks = { store = 1, warehouse = 2 }   # store: from the warehouse; warehouse: from suppliers
safety_factor = 1.5                       # reorder point = weekly demand x lead time x safety factor
price_elasticity = 0.5                    # within a category, cheaper products sell more units
price_factor_range = [0.5, 2.0]
popularity_range = [0.6, 1.5]             # product-level demand multiplier (seeded)
location_noise_range = [0.85, 1.15]       # per location and product (seeded)
store_display_units = { under_100_eur = 3, under_500_eur = 2, from_500_eur = 1 }
flagship_extra_units = 1
warehouse_minimum_units = 4

# Planning assumption for the full business (20 000 customers buying about 4.4 orders
# of 1.5 units a year): typical weekly unit sales of ONE product across all 16
# locations, at the category reference price (EUR incl. VAT). Average about 6.7 units
# per product per week, about 2 550 units a week for the products on sale at the start.
# Revisit when the order simulation volume is set.
[inventory.category_demand]
SMARTPHONES = { weekly_units = 8.0, reference_price_eur = 600 }
LAPTOPS     = { weekly_units = 4.0, reference_price_eur = 1000 }
TABLETS     = { weekly_units = 3.0, reference_price_eur = 500 }
TV_AUDIO    = { weekly_units = 3.0, reference_price_eur = 900 }
HEADPHONES  = { weekly_units = 8.0, reference_price_eur = 150 }
WEARABLES   = { weekly_units = 5.0, reference_price_eur = 150 }
CAMERAS     = { weekly_units = 1.6, reference_price_eur = 800 }
GAMING      = { weekly_units = 5.0, reference_price_eur = 150 }
SMART_HOME  = { weekly_units = 6.0, reference_price_eur = 80 }
ACCESSORIES = { weekly_units = 14.0, reference_price_eur = 30 }

[transactions]
# Pilot customer orders, payments and stock movements (Phase 3, step 3):
# python/run_transactions.py. Approved volume: the pilot only (the order count is
# the sum of [transactions.scenarios]); larger volumes wait for the pilot review.
# Every order uses existing customers, products, prices and opening stock, and runs
# through the V006/V007 units of work: U1 place, U2 reserve, U3 pay, U4 expire,
# U5 fulfil, each in its own transaction, in business-time order.
start_date = 2024-11-01                   # first order day (not before inventory.opening_date)
days = 14                                 # orders are placed on start_date .. start_date + days - 1
first_order_sequence = 1                  # order numbers SE-2024-00000001, ... in placed_at order
online_share = 0.55                       # share of orders placed online (rest in store)
lines_per_order = { "1" = 0.70, "2" = 0.25, "3" = 0.05 }
two_units_share = 0.20                    # lines of products under 50 EUR bought two at a time
online_hours = [7, 23]                    # local hours when online orders are placed (from, to)
store_hours = [10, 19]                    # local opening hours; stores are closed on Sundays
reservation_minutes = { online = 15, in_store = 5 }   # V007: reservation lifetime (expires_at)
max_payment_attempts = 3                  # DBML U3: at most 3 attempts per order
fulfilment_cutoff_hour = 14               # online: confirmed before 14:00 local ships the same afternoon
failure_reasons = ["card_declined", "insufficient_funds", "timeout"]

[transactions.payment_methods]
online   = { card = 0.55, mobile_payment = 0.25, buy_now_pay_later = 0.20 }
in_store = { card = 0.75, mobile_payment = 0.15, cash = 0.10 }

[transactions.providers]                  # synthetic payment service providers
card = "synthpay_card"
mobile_payment = "synthpay_mobile"
buy_now_pay_later = "synthpay_invoice"
cash = "store_cash_register"

[transactions.shipping]
# Shipping fee charged on online orders (incl. VAT, local currency); free from the
# threshold (items total incl. VAT). In-store orders have no fee. Only the fee is
# part of the order total: shipments and deliveries come in a later step.
fee       = { SE = 49, NO = 59, DK = 39, FI = 4.90 }
free_from = { SE = 499, NO = 599, DK = 399, FI = 49 }

[transactions.scenarios]
# Pilot mix, weighted on purpose so that every path of the order lifecycle is used.
fulfilled = 12                  # reserved, paid on the first attempt, confirmed, fulfilled
payment_retry_fulfilled = 2     # first attempt fails, the retry is captured, fulfilled
payment_failed = 2              # every attempt fails: payment_failed, stock released
customer_cancelled = 1          # reserved, customer cancels before paying: stock released
reservation_expired = 1         # reserved, never paid: the sweeper expires the stock (U4)
out_of_stock_quantity = 1       # asks for more units than the warehouse holds: cancelled out_of_stock
out_of_stock_reserved = 1       # the last unit in a store is reserved by a customer one till away

[replenishment]
# Replenishment pilot (Phase 3, step 4): python/run_replenishment.py. Approved design:
# docs/phase3_replenishment_feasibility.md, decisions D1 to D7 and D9 to D11 (D8, demand
# recalibration, waits for the combined full-scale activity simulation). Pilot profile only.
# It starts after the last event of the pilot transactions (2024-11-15 08:44:22 UTC, taken
# from the transaction plan, never earlier), adds no orders, and keeps business-time order:
#   R0  warehouse reorder points revised to echelon demand (online + the market's stores)
#   T1  transfer_out from the market warehouse, T2 transfer_in at the store (same market)
#   R1  purchase_receipt at the warehouse for each supplier delivery note
# Policy (s, S): replenish when inventory position <= reorder point, up to the order-up-to
# level from [inventory] weeks_of_cover (stores: at least the display minimum).
first_review_date = 2024-11-15            # first store review: the evening the pilot ends
end_date = 2024-12-06                     # last day; everything must have arrived by then
first_document_sequence = 1               # TR-SE-2024-000001-SE-STO-03, PO-SE-2024-000001/DN1
revision_hour = 18                        # local hour of R0 on first_review_date (before the first review)
store_review_hour = 20                    # local, after closing, Monday to Saturday
warehouse_review_weekday = 1              # ISO weekday of the warehouse review (1 = Monday)
warehouse_review_hour = 9                 # local, after the morning dispatch
warehouse_days = [1, 2, 3, 4, 5]          # ISO weekdays when warehouses dispatch and receive (D9)
dispatch_hours = [6, 8]                   # local: transfers leave the warehouse (from, to)
transit_minutes = [45, 105]               # same morning, before the store opens (D4: <= 1 business day)
receiving_hours = [7, 15]                 # local: supplier deliveries at the warehouse (D9)
supplier_lead_days = [10, 14]             # purchase order to first delivery note (D4)
split_delivery_gap_days = [2, 4]          # working days between DN1 and DN2 of a split delivery
pre_launch_days = { warehouse = 7, store = 1 }   # first stock may arrive this early before launch (D7)
echelon_reorder_points = true             # D2a: revise warehouse reorder points in the database (R0)
warehouse_protection = "reorder_point"    # D5: transfers never take a warehouse below its reorder point
case_packs = { SMARTPHONES = 5, LAPTOPS = 2, TABLETS = 2, TV_AUDIO = 1, HEADPHONES = 5, WEARABLES = 5, CAMERAS = 2, GAMING = 2, SMART_HOME = 4, ACCESSORIES = 10 }

[replenishment.scenarios]
# Pilot mix (D1). No warehouse reaches its reorder point in the window (pilot demand is about
# 6% of the modelled demand), so the receipt path is exercised on purpose: at the first
# warehouse review each market orders the listing with the least headroom. These purchase
# orders are flagged forced_reorder; transfers to stores are always natural (reorder point).
forced_reorders = { SE = 1, NO = 1, DK = 1, FI = 1 }
split_deliveries = ["SE"]                 # the SE forced purchase order arrives in two delivery notes

[demand]
# Demand model of the combined activity (Phase 3, step 5, stage S2): python/nordiccart/demand.
# Design: docs/phase3_combined_activity_design.md sections 5, 6 and 11.1 (decisions C1 to C3, C11).
# One model for order volume, the channel, location and product mix, the opening stock of
# products added later (stage S7) and the monthly reorder point review R-cal (stage S6).
# New in S2 and read only by the demand module: the pilots do not use this section.
# Shared with the pilots and read from their sections, unchanged: [transactions] online_share,
# lines_per_order, two_units_share, online_hours, store_hours; [inventory] category_demand,
# price_elasticity, price_factor_range, popularity_range, store_format_weight, weeks_of_cover,
# lead_time_weeks, safety_factor.
orders_per_customer_year = 2.4            # mean personal rate (orders per seasonal customer-year)
rate_shape = 0.8                          # gamma shape k of the personal rate (k = 0.8: 33% buy nothing in a full year)
market_factor = { SE = 1.0, NO = 1.0, DK = 1.0, FI = 1.0 }   # C1: no market-specific propensity
generation_start = 2024-12-03             # first day of the combined activity (after the pilots)
generation_end = 2027-10-31               # S10: last day of synthetic activity (demand calendar, exchange rates). Master
                                          # data keep calendar.simulation_end: no new customers or launches after it
growth_year = [2024-12-03, 2025-10-31]
primary_year = [2025-11-01, 2026-10-31]   # primary analytics year (design 10.3)
channel_period = [2024-12-03, 2026-10-31] # the online share of orders is solved over this period
in_store_signup_store_share = 0.70        # in-store sign-ups buy in store 70% of the time
home_city_weight = 3                      # a store in the customer's home city weighs 3 times
# Monthly index (raw; normalized per Nov-to-Oct simulation year so that sum(S* x days) = days in the year)
monthly_index = { 1 = 0.95, 2 = 0.80, 3 = 0.85, 4 = 0.85, 5 = 0.90, 6 = 0.90, 7 = 0.80, 8 = 0.95, 9 = 0.95, 10 = 1.00, 11 = 1.45, 12 = 1.60 }
# Day weights within a month by ISO weekday (1 = Monday), normalized inside every month
online_weekday_weights = { 1 = 1.10, 2 = 1.00, 3 = 1.00, 4 = 1.00, 5 = 0.95, 6 = 0.85, 7 = 1.10 }
store_weekday_weights = { 1 = 0.85, 2 = 0.90, 3 = 0.95, 4 = 1.05, 5 = 1.15, 6 = 1.60, 7 = 0.0 }
store_closed_days = ["12-25", "12-26", "01-01"]   # MM-DD, stores closed (weight 0)
black_week_weight = 3                     # Monday to Sunday around Black Friday, November days only
# Hour weights (local hour -> weight), normalized over the open hours; hours must match
# [transactions] online_hours = [7, 23] and store_hours = [10, 19]
online_hour_weights = { 7 = 0.40, 8 = 0.60, 9 = 0.80, 10 = 0.90, 11 = 1.00, 12 = 1.10, 13 = 1.00, 14 = 0.95, 15 = 0.95, 16 = 1.00, 17 = 1.05, 18 = 1.15, 19 = 1.40, 20 = 1.55, 21 = 1.45, 22 = 0.90 }
store_hour_weights = { 10 = 0.60, 11 = 0.85, 12 = 1.20, 13 = 1.25, 14 = 1.15, 15 = 1.20, 16 = 1.25, 17 = 0.95, 18 = 0.70 }

[demand.attractiveness]
# Product attractiveness = category weight x price factor x popularity ([inventory], the same
# figures as the opening model) x product life cycle below. It only splits demand between
# products; the volume comes from the customers.
launch_ramp_weeks = 6                     # demand ramps up over the first weeks after launch
launch_start_factor = 0.4                 # ... starting at 40% on the launch day
decline_after_months = 18                 # then flat; after 18 months it declines
decline_per_month = 0.03                  # ... by 3 points a month
decline_floor = 0.4                       # ... to at least 40%

[demand.lifecycle]
# Order outcomes (C11). Failure is per payment attempt; a retry follows a failure with the
# retry share while attempts remain. Abandoned checkouts expire (U4); cancellations happen
# before paying. Out-of-stock outcomes come from the stock simulation, not from these rates.
online   = { first_attempt_failure = 0.06, retry_after_failure = 0.60, max_attempts = 3, abandoned_checkout = 0.03, customer_cancel = 0.01 }
in_store = { first_attempt_failure = 0.02, retry_after_failure = 0.50, max_attempts = 2, abandoned_checkout = 0.0, customer_cancel = 0.002 }

[activity]
# Combined activity engine (Phase 3, step 5, stage S6): monthly business rules, read only by
# python/nordiccart/activity. Design docs/phase3_combined_activity_design.md sections 6 and 7.1, decision C8.
markdown_after_months = [6, 12]           # P1: lifecycle markdowns when a product is this many months old
markdown_range = [0.03, 0.08]             # ... each lowers the list price by 3% to 8% (seeded per product and step)
rcal_local_hour = 5                       # R-cal: first working day of each month, local hour (before the 05:30 store review)